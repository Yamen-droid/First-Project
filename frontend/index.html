<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense Tracker</title>

    <!-- Bootstrap CSS -->
    <link

        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"

        rel="stylesheet"

    >
    <!-- Our CSS -->

    <link rel="stylesheet" href="style.css">

</head>
<body>
    <!-- ================= NAVBAR ================= -->

    <nav class="navbar navbar-dark bg-primary">

        <div class="container">

            <span class="navbar-brand mb-0 h1">

                Expense Tracker

            </span>

        </div>

    </nav>





    <!-- ================= ALERT ================= -->

    <div class="container mt-3">

        <div id="alertContainer"></div>

    </div>





    <!-- ================= MAIN ================= -->

    <div class="container my-4">



        <h1 class="mb-4">

            Expense Tracker

        </h1>





        <!-- ================= SUMMARY CARDS ================= -->

        <div class="row g-3 mb-4 summary-cards">



            <!-- Total -->

            <div class="col-md-4">

                <div class="card shadow-sm h-100">

                    <div class="card-body">



                        <h5 class="card-title">

                            Total Expenses

                        </h5>



                        <h2 id="totalAmount">

                            0.00

                        </h2>



                    </div>

                </div>

            </div>





            <!-- Number -->

            <div class="col-md-4">

                <div class="card shadow-sm h-100">

                    <div class="card-body">



                        <h5 class="card-title">

                            Number of Expenses

                        </h5>



                        <h2 id="expenseCount">

                            0

                        </h2>



                    </div>

                </div>

            </div>





            <!-- Highest -->

            <div class="col-md-4">

                <div class="card shadow-sm h-100">

                    <div class="card-body">



                        <h5 class="card-title">

                            Highest Expense

                        </h5>



                        <h2 id="highestExpense">

                            0.00

                        </h2>



                    </div>

                </div>

            </div>



        </div>





        <!-- ================= ADD EXPENSE FORM ================= -->

        <div class="card shadow-sm mb-4">



            <div class="card-header">

                <h4 class="mb-0">

                    Add Expense

                </h4>

            </div>



            <div class="card-body">



                <form id="expenseForm">



                    <div class="row g-3">



                        <!-- Title -->

                        <div class="col-md-6">



                            <label

                                for="description"

                                class="form-label"

                            >

                                Title

                            </label>



                            <input

                                type="text"

                                class="form-control"

                                id="description"

                                placeholder="Enter expense title"

                            >



                            <div

                                id="descriptionError"

                                class="text-danger small mt-1"

                            ></div>



                        </div>





                        <!-- Amount -->

                        <div class="col-md-6">



                            <label

                                for="amount"

                                class="form-label"

                            >

                                Amount

                            </label>



                            <input

                                type="number"

                                step="0.01"

                                class="form-control"

                                id="amount"

                                placeholder="Enter amount"

                            >



                            <div

                                id="amountError"

                                class="text-danger small mt-1"

                            ></div>



                        </div>





                        <!-- Category -->

                        <div class="col-md-6">



                            <label

                                for="category"

                                class="form-label"

                            >

                                Category

                            </label>



                            <select

                                class="form-select"

                                id="category"

                            >



                                <option value="">

                                    Select category

                                </option>



                                <option value="Food">

                                    Food

                                </option>



                                <option value="Transport">

                                    Transport

                                </option>



                                <option value="Shopping">

                                    Shopping

                                </option>



                                <option value="Bills">

                                    Bills

                                </option>



                                <option value="Other">

                                    Other

                                </option>



                            </select>



                            <div

                                id="categoryError"

                                class="text-danger small mt-1"

                            ></div>



                        </div>





                        <!-- Date -->

                        <div class="col-md-6">



                            <label

                                for="expense_date"

                                class="form-label"

                            >

                                Date

                            </label>



                            <input

                                type="date"

                                class="form-control"

                                id="expense_date"

                            >



                            <div

                                id="dateError"

                                class="text-danger small mt-1"

                            ></div>



                        </div>





                        <!-- Button -->

                        <div class="col-12">



                            <button

                                type="submit"

                                class="btn btn-primary"

                            >

                                Add Expense

                            </button>



                        </div>



                    </div>



                </form>



            </div>

        </div>





        <!-- ================= FILTER ================= -->

        <div class="card shadow-sm mb-4">



            <div class="card-body">



                <label

                    for="categoryFilter"

                    class="form-label"

                >

                    Filter by Category

                </label>



                <select

                    id="categoryFilter"

                    class="form-select"

                >



                    <option value="All">

                        All

                    </option>



                    <option value="Food">

                        Food

                    </option>



                    <option value="Transport">

                        Transport

                    </option>



                    <option value="Shopping">

                        Shopping

                    </option>



                    <option value="Bills">

                        Bills

                    </option>



                    <option value="Other">

                        Other

                    </option>



                </select>



            </div>



        </div>





        <!-- ================= LOADING SPINNER ================= -->

        <div

            id="loadingSpinner"

            class="text-center my-4"

            style="display: none;"

        >



            <div

                class="spinner-border text-primary"

                role="status"

            >

                <span class="visually-hidden">

                    Loading...

                </span>

            </div>



            <p class="mt-2">

                Loading expenses...

            </p>



        </div>





        <!-- ================= EXPENSE TABLE ================= -->

        <div class="card shadow-sm">



            <div class="card-header">

                <h4 class="mb-0">

                    Expenses

                </h4>

            </div>



            <div class="card-body">



                <div class="table-responsive">



                    <table

                        class="table table-striped table-hover align-middle"

                    >



                        <thead class="table-dark">



                            <tr>

                                <th>Title</th>

                                <th>Amount</th>

                                <th>Category</th>

                                <th>Date</th>

                                <th>Actions</th>

                            </tr>



                        </thead>



                        <tbody id="expenseTableBody">

                        </tbody>



                    </table>



                </div>



            </div>



        </div>



    </div>





    <!-- ================= EDIT MODAL ================= -->

    <div

        class="modal fade"

        id="editModal"

        tabindex="-1"

        aria-hidden="true"

    >



        <div class="modal-dialog">



            <div class="modal-content">



                <div class="modal-header">



                    <h5 class="modal-title">

                        Edit Expense

                    </h5>



                    <button

                        type="button"

                        class="btn-close"

                        data-bs-dismiss="modal"

                        aria-label="Close"

                    ></button>



                </div>





                <div class="modal-body">



                    <input

                        type="hidden"

                        id="editId"

                    >





                    <!-- Edit Title -->

                    <div class="mb-3">



                        <label

                            for="editDescription"

                            class="form-label"

                        >

                            Title

                        </label>



                        <input

                            type="text"

                            class="form-control"

                            id="editDescription"

                        >



                        <div

                            id="editDescriptionError"

                            class="text-danger small mt-1"

                        ></div>



                    </div>





                    <!-- Edit Amount -->

                    <div class="mb-3">



                        <label

                            for="editAmount"

                            class="form-label"

                        >

                            Amount

                        </label>



                        <input

                            type="number"

                            step="0.01"

                            class="form-control"

                            id="editAmount"

                        >



                        <div

                            id="editAmountError"

                            class="text-danger small mt-1"

                        ></div>



                    </div>





                    <!-- Edit Category -->

                    <div class="mb-3">



                        <label

                            for="editCategory"

                            class="form-label"

                        >

                            Category

                        </label>



                        <select

                            class="form-select"

                            id="editCategory"

                        >



                            <option value="Food">

                                Food

                            </option>



                            <option value="Transport">

                                Transport

                            </option>



                            <option value="Shopping">

                                Shopping

                            </option>



                            <option value="Bills">

                                Bills

                            </option>



                            <option value="Other">

                                Other

                            </option>



                        </select>



                        <div

                            id="editCategoryError"

                            class="text-danger small mt-1"

                        ></div>



                    </div>





                    <!-- Edit Date -->

                    <div class="mb-3">



                        <label

                            for="editDate"

                            class="form-label"

                        >

                            Date

                        </label>



                        <input

                            type="date"

                            class="form-control"

                            id="editDate"

                        >



                        <div

                            id="editDateError"

                            class="text-danger small mt-1"

                        ></div>



                    </div>



                </div>





                <div class="modal-footer">



                    <button

                        type="button"

                        class="btn btn-secondary"

                        data-bs-dismiss="modal"

                    >

                        Cancel

                    </button>



                    <button

                        type="button"

                        class="btn btn-primary"

                        id="saveEditButton"

                    >

                        Save Changes

                    </button>



                </div>



            </div>



        </div>
    </div>
    <!-- ================= BOOTSTRAP JS ================= -->

    <script

        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"

    ></script>

    <!-- Our JavaScript -->

    <script src="script.js"></script>
</body>
</html>
